version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: windmill
      POSTGRES_USER: windmill
      POSTGRES_PASSWORD: windmill_secret_password_2026
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windmill"]
      interval: 5s
      timeout: 5s
      retries: 5

  windmill_server:
    image: ghcr.io/windmill-labs/windmill:latest
    restart: unless-stopped
    ports:
      - "8090:8000"
    environment:
      - DATABASE_URL=postgres://windmill:windmill_secret_password_2026@db:5432/windmill?sslmode=disable
      - MODE=server
      - BASE_URL=http://localhost:8090
    depends_on:
      db:
        condition: service_healthy

  windmill_worker:
    image: ghcr.io/windmill-labs/windmill:latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://windmill:windmill_secret_password_2026@db:5432/windmill?sslmode=disable
      - MODE=worker
      - WORKER_GROUP=default
      - KEEP_JOB_DIR=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../:/workspace:rw
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
